networks:
    personal-finance:
        driver: bridge
services:
    php-fpm:
        build:
            context: docker/php-fpm
            dockerfile: Dockerfile
        container_name: php-fpm
        restart: always
        working_dir: /var/www/
        ports:
            - "9000:9000"
            - "5174:5174"
        networks:
            - personal-finance
        volumes:
            - ./:/var/www/
            - ./logs/nginx/:/var/log/nginx
            - ./database:/var/www/database
        user: "1000:1000"
    nginx:
        build:
            context: docker/nginx
            dockerfile: Dockerfile
        container_name: nginx
        restart: unless-stopped
        depends_on:
            - php-fpm
        networks:
            - personal-finance
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./:/var/www
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

